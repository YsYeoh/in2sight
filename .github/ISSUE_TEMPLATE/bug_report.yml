name: Bug report
description: Something does not work as the docs or UI say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste access tokens, `.env` contents, or real follower or commenter data.** For a security problem use the private route in SECURITY.md, not an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See ..."
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (page or API route)
      placeholder: "Account → Content, /api/cron/tick, ..."
  - type: input
    id: env
    attributes:
      label: Browser, device and version or commit
  - type: textarea
    id: logs
    attributes:
      label: Error text or screenshot (with any names and numbers you do not want public blurred)
