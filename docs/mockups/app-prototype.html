const ACC=[{id:0,u:'brandx.official',l:'B',g:'Brand X',f:12480,fd:3.2,r:184200,rd:11.8,v:412900,er:4.8,po:12,st:'ok',tok:54},{id:1,u:'brandx.shop',l:'S',g:'Brand X',f:5320,fd:1.1,r:61200,rd:-2.4,v:140300,er:3.9,po:9,st:'ok',tok:41},{id:2,u:'studio.two',l:'T',g:'Personal projects',f:8905,fd:5.6,r:97400,rd:18.2,v:221800,er:6.1,po:15,st:'wn',tok:6},{id:3,u:'old.account',l:'O',g:null,f:1620,fd:-0.8,r:8300,rd:-14.5,v:15200,er:2.2,po:3,st:'er',tok:0}];

{const h=(new URLSearchParams(location.search).get("r")||location.hash.slice(1)).split("/");if(h[0]){S.route=h[0];if(h[1]){S.tab=h[1];S.stab=h[1]}}}

/* ================= motion helpers ================= */
function particles(cv,o={}){const x=cv.getContext('2d');let w,h,P=[],mx=-999,my=-999,run=true,col,mu,fr=0,vis=true;
  const init=()=>{const d=devicePixelRatio||1;w=cv.clientWidth;h=cv.clientHeight;cv.width=w*d;cv.height=h*d;x.setTransform(d,0,0,d,0,0);P=[...Array(Math.max(8,Math.round(w*h/(o.dens||12000))))].map(()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:Math.random()*1.2+.8}))};
  const ro=new ResizeObserver(init);ro.observe(cv);const par=cv.parentElement;
  const mv=e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top},lv=()=>{mx=my=-999};par.addEventListener('pointermove',mv);par.addEventListener('pointerleave',lv);

    x.clearRect(0,0,w,h);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);if(d<100){p.x+=dx/d*1.4;p.y+=dy/d*1.4}if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;x.globalAlpha=.5;x.fillStyle=mu;x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
    const L2=o.link||90;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<L2){x.globalAlpha=(1-d/L2)*.35;x.strokeStyle=col;x.beginPath();x.moveTo(P[i].x,P[i].y);x.lineTo(P[j].x,P[j].y);x.stroke()}}x.globalAlpha=1})();
  cleanups.push(()=>{run=false;ro.disconnect();io.disconnect();par.removeEventListener('pointermove',mv);par.removeEventListener('pointerleave',lv)});}

function vLogin(){const r=$('#login');r.innerHTML=`<canvas id="lc"></canvas><div class="lcard" id="lcard"><div class="row" style="gap:10px;margin-bottom:18px"><div class="logo"></div><b style="font-size:17px">in2sight</b></div><h1 class="h1" style="font-size:20px;margin-bottom:2px">${L('Sign in','登录')}</h1><div class="small muted" style="margin-bottom:16px">${L('Your Instagram insights, in one place.','你的 Instagram 数据洞察,集中在一处。')}</div><div class="col" style="gap:12px"><div class="field"><label>Email</label><input class="input" value="owner@example.com"></div><div class="field"><label>${L('Password','密码')}</label><input class="input" type="password" value="password"></div><button class="btn primary" id="loginB" style="height:calc(var(--ctl) + 4px);margin-top:4px">${L('Sign in','登录')}</button></div></div>`;
  const cv=$('#lc');particles(cv,{dens:8000,link:110});if(gs())gs().from('#lcard',{y:28,opacity:0,scale:.97,duration:.8,ease:'power3.out'})}
function dialogs(){$('#dlgs').innerHTML=`
 <div class="overlay" id="dlgConn"><div class="dialog"><div class="dh"><h3 class="h3" style="font-size:16px" id="cnT">${L('Add account','添加账号')}</h3></div><div class="db col" id="cnB" style="gap:12px"></div><div class="df" id="cnF"></div></div></div>
 <div class="overlay" id="dlgTag"><div class="dialog"><div class="dh"><h3 class="h3" style="font-size:16px">${L('New tag','新建标签')}</h3></div><div class="db col" style="gap:12px"><div class="field"><label class="req">${L('Tag name','标签名称')}</label><input class="input" id="tagName" placeholder="${L('e.g. Tutorials','例如:教程')}"></div><div class="field"><label>${L('Color','颜色')}</label><div class="swpick" id="swp">${[1,2,3,4,5,6].map(i=>`<button data-c="${i}" class="${i===1?'on':''}" style="background:var(--chart-${i})"></button>`).join('')}</div></div></div><div class="df"><button class="btn secondary" data-close>${L('Cancel','取消')}</button><button class="btn primary" id="tagSave">${L('Create tag','创建标签')}</button></div></div></div>
 <div class="overlay" id="dlgTags"><div class="dialog"><div class="dh"><h3 class="h3" style="font-size:16px">${L('Edit tags','编辑标签')}</h3><div class="small muted">5 tips to grow your reach</div></div><div class="db col" style="gap:10px">${S.tags.map((t,i)=>`<label class="check"><input type="checkbox" ${i===0?'checked':''}><span class="box">${ic('check')}</span><span class="swatch" style="background:${t[1]}"></span>${t[0]}</label>`).join('')}</div><div class="df"><button class="btn secondary" data-close>${L('Cancel','取消')}</button><button class="btn primary" data-close data-toast="ok|${L('Tags updated','标签已更新')}|">${L('Save','保存')}</button></div></div></div>`;
  connStep(1)}
function connStep(n){const b=$('#cnB'),f=$('#cnF');if(!b)return;
  if(n===1){b.innerHTML=`<span class="muted">${L('Log in to the Instagram account you want to add. It must be a Creator or Business account.','请登录你要添加的 Instagram 账号。必须是创作者或商业账号。')}</span><div class="field"><label>${L('Group (optional)','分组(可选)')}</label><div class="pop block"><div class="select" data-menu><span class="v">${L('None (isolated)','无(独立账号)')}</span>${ic('down')}</div><div class="menu"><div class="menu-item sel" data-label="${L('None (isolated)','无(独立账号)')}">${L('None (isolated)','无(独立账号)')}<i class="ck">${ic('check')}</i></div><div class="menu-item" data-label="Brand X">Brand X<i class="ck">${ic('check')}</i></div><div class="menu-item" data-label="Personal projects">Personal projects<i class="ck">${ic('check')}</i></div></div></div></div><div class="alert info">${ic('lock',16)}<div><span>${L('Read-only access to insights. Revoke any time in Instagram settings.','仅有读取洞察的权限,可随时在 Instagram 设置中撤销。')}</span></div></div>`;
    f.innerHTML=`<button class="btn secondary" data-close>${L('Cancel','取消')}</button><button class="btn primary" id="cnGo">${ic('cam')}${L('Continue with Instagram','使用 Instagram 继续')}</button>`;UI.hydrate(b)}
  if(n===2){b.innerHTML=`<div class="empty"><div class="ico">${ic('cam',20)}</div><b style="font-weight:500">${L('Waiting for Instagram…','等待 Instagram 授权…')}</b><span class="small muted">${L('Approve access in the Instagram window.','请在 Instagram 窗口中批准访问。')}</span><div class="progress" style="width:200px;margin-top:8px"><i id="cnP" style="width:0"></i></div></div>`;f.innerHTML='';
    if(gs())gs().to('#cnP',{width:'100%',duration:1.6,ease:'power1.inOut',onComplete:()=>connStep(3)});else setTimeout(()=>connStep(3),1200)}
  if(n===3){b.innerHTML=`<div class="empty"><div class="okc">${ic('check')}</div><b style="font-weight:500">@newaccount.demo ${L('connected','已连接')}</b><span class="small muted">${L('First sync is running. History starts building from today.','正在进行首次同步,历史数据从今天起开始积累。')}</span></div>`;f.innerHTML=`<button class="btn primary" id="cnDone">${L('Done','完成')}</button>`;
    if(gs()){gs().from('.okc',{scale:0,duration:.6,ease:'back.out(2.4)'});const p=$('.okc svg path');if(p){const l=p.getTotalLength();gs().fromTo(p,{strokeDasharray:l,strokeDashoffset:l},{strokeDashoffset:0,duration:.6,delay:.25,ease:'power2.out'})}}}}

/* globe (Three.js, lazy) */
function globeLoad(){const el=$('#globe');if(!el)return;const go=()=>{if(!$('#globe'))return;const T=window.THREE,cs=getComputedStyle(el);
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,10);cam.position.z=3.1;const rn=new T.WebGLRenderer({alpha:true,antialias:true});rn.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(rn.domElement);rn.domElement.style.cssText='width:100%;height:100%;display:block';
  const grp=new T.Group();sc.add(grp);const sph=new T.Mesh(new T.SphereGeometry(.99,48,32),new T.MeshBasicMaterial({color:cs.getPropertyValue('--surface').trim()}));grp.add(sph);
  const n=1500,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),a=i*2.399963;pos.set([Math.cos(a)*r,y,Math.sin(a)*r],i*3)}const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(pos,3));
  const pts=new T.Points(g,new T.PointsMaterial({size:.018,transparent:true,opacity:.7,color:cs.getPropertyValue('--muted-foreground').trim()}));grp.add(pts);
  const ll=(la,lo,r=1.01)=>{const p=(90-la)*Math.PI/180,t=(lo+180)*Math.PI/180;return new T.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
  const marks=[[4,102,.05],[1.3,103.8,.035],[-6,106,.04],[37,-95,.03],[52,-1,.028],[-25,133,.028],[35,139,.03]].map(([a,b,s])=>{const m=new T.Mesh(new T.SphereGeometry(s,12,12),new T.MeshBasicMaterial({color:cs.getPropertyValue('--primary').trim()}));m.position.copy(ll(a,b));grp.add(m);gs()&&gs().to(m.scale,{x:1.7,y:1.7,z:1.7,duration:1+Math.random(),repeat:-1,yoyo:true,ease:'sine.inOut'});return m});
  grp.rotation.set(.3,-1.75,0);const rs=()=>{rn.setSize(el.clientWidth,el.clientHeight,false);cam.aspect=el.clientWidth/el.clientHeight;cam.updateProjectionMatrix()};const ro=new ResizeObserver(rs);ro.observe(el);rs();
  let drag=false,lx=0,ly=0,run=true,vis=true;el.onpointerdown=e=>{drag=true;lx=e.clientX;ly=e.clientY;el.style.cursor='grabbing';el.setPointerCapture(e.pointerId)};el.onpointerup=()=>{drag=false;el.style.cursor='grab'};el.onpointermove=e=>{if(!drag)return;grp.rotation.y+=(e.clientX-lx)*.008;grp.rotation.x=Math.max(-1,Math.min(1,grp.rotation.x+(e.clientY-ly)*.008));lx=e.clientX;ly=e.clientY};
  const io=new IntersectionObserver(e=>vis=e[0].isIntersecting);io.observe(el);
  (function f(){if(!run)return;requestAnimationFrame(f);if(!vis||document.hidden)return;if(!drag)grp.rotation.y+=.0025;rn.render(sc,cam)})();
  cleanups.push(()=>{run=false;ro.disconnect();io.disconnect();rn.dispose()});
  const onChange=()=>{const c=getComputedStyle(el);sph.material.color.set(c.getPropertyValue('--surface').trim());pts.material.color.set(c.getPropertyValue('--muted-foreground').trim());marks.forEach(m=>m.material.color.set(c.getPropertyValue('--primary').trim()))};document.addEventListener('kit:change',onChange);cleanups.push(()=>document.removeEventListener('kit:change',onChange))};
  if(window.THREE)go();else{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';s.onload=go;document.head.appendChild(s)}}

/* ================= router ================= */
function render(anim=true){cleanups.forEach(c=>c());cleanups=[];
  const login=S.route==='login';$('#login').style.display=login?'grid':'none';$('#side').style.display=login?'none':'';$('.mainw').style.display=login?'none':'';$('#app').style.gridTemplateColumns=login?'1fr':'';
  if(login){vLogin();return}
  shell();const v=$('#view');
  v.innerHTML=({overview:vOverview,accounts:vAccounts,account:vAccount,tags:vTags,settings:vSettings})[S.route]();UI.hydrate(v);
  ({overview:mOverview,account:mTab,tags:mTags})[S.route]?.();
  if(anim){enter();countUp();moveInd()}else{countUp();moveInd()}
  v.scrollTop=0}
function go(r,o={}){Object.assign(S,o);S.route=r;if(r==='login'){render();return}
  if(gs()&&$('#view').innerHTML)gs().to('#view',{opacity:0,y:-6,duration:.15,onComplete:()=>{render();gs().set('#view',{opacity:1,y:0})}});else render()}
on('click',e=>{
  if(!e.target.closest('.ui'))return;
  if(e.target.closest('[data-open="dlgConn"]'))connStep(1);
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const ac=e.target.closest('[data-acct]');if(ac){go('account',{acct:+ac.dataset.acct,tab:'overview'});return}
  const tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.dataset.tab;cleanups.forEach(c=>c());cleanups=[];qa('.tab[data-tab]').forEach(x=>x.classList.toggle('on',x===tb));$('#tabBody').innerHTML=vTab();UI.hydrate($('#tabBody'));mTab();enter('#tabBody');countUp();return}
  const st=e.target.closest('[data-stab]');if(st){S.stab=st.dataset.stab;render();return}
  const sc=e.target.closest('[data-scope]');if(sc){S.scope=sc.dataset.scope;qa('#scopeSeg button').forEach(b=>b.classList.toggle('on',b===sc));mOverview.chartOnly=1;const lab=[...Array(30)].map((_,i)=>dl(i,30)),pool=S.scope==='group'?ACC.filter(a=>a.g==='Brand X'):ACC;Charts.anim=true;Charts.line($('#cmpChart'),{h:200,labels:lab,legend:true,series:pool.map(a=>({name:'@'+a.u,data:gen(a.id*5+2,30,a.r/30,a.r/60,a.r/900),color:`var(--chart-${a.id+1})`}))});return}
  const th=e.target.closest('[data-theme]');if(th&&th.classList.contains('tcard')){document.querySelector(`.ui-bar [data-t="${th.dataset.theme}"]`).click();return}
  const mm=e.target.closest('[data-mm]');if(mm){document.querySelector(`.ui-bar [data-m="${mm.dataset.mm}"]`).click();return}
  const dd=e.target.closest('[data-dd]');if(dd){document.querySelector(`.ui-bar [data-d="${dd.dataset.dd}"]`).click();return}
  const rr=e.target.closest('[data-rr]');if(rr){document.querySelector(`.ui-bar [data-rad="${rr.dataset.rr}"]`).click();return}
  const ll=e.target.closest('[data-ll]');if(ll){document.querySelector(`.ui-bar [data-l="${ll.dataset.ll}"]`).click();return}
  const rg=e.target.closest('[data-range]');if(rg){S.range=rg.dataset.range;$('#rngL').textContent=rg.textContent.trim();return}
  if(e.target.closest('#collapse')){$('#app').classList.toggle('mini');setTimeout(moveInd,320);return}
  if(e.target.closest('#modeB')){document.querySelector(`.ui-bar [data-m="${UI.state.mode==='l'?'d':'l'}"]`).click();return}
  const sy=e.target.closest('#syncB,#syncB2');if(sy){const sv=sy.querySelector('svg');sv.classList.add('spin');UI.toast('in',L('Syncing…','同步中…'),L('Fetching latest insights.','正在获取最新数据。'));setTimeout(()=>{sv.classList.remove('spin');UI.toast('ok',L('Synced','同步完成'),L('3 accounts updated.','已更新 3 个账号。'))},1600);return}
  if(e.target.closest('#loginB')){const b=e.target.closest('#loginB');b.classList.add('loading');setTimeout(()=>{if(gs())gs().to('#lcard',{y:-20,opacity:0,scale:.97,duration:.4,onComplete:()=>go('overview')});else go('overview')},700);return}
  if(e.target.closest('#cnGo')){connStep(2);return}
  if(e.target.closest('#cnDone')){document.getElementById('dlgConn').classList.remove('open');if(!S.extra.length){S.extra.push({id:4,u:'newaccount.demo',l:'N',g:null,f:340,fd:0,r:0,rd:0,v:0,er:0,po:0,st:'ok',tok:60,tp:'Creator'});UI.toast('ok',L('Account added','账号已添加'),'@newaccount.demo')}connStep(1);if(S.route==='accounts'||S.route==='overview')render(false);dialogs();return}
  const sw=e.target.closest('#swp button');if(sw){qa('#swp button').forEach(b=>b.classList.toggle('on',b===sw));return}
  if(e.target.closest('#tagSave')){const n=$('#tagName').value.trim();if(!n){$('#tagName').classList.add('invalid');return}const c=+$('#swp .on').dataset.c;S.tags.push([n,`var(--chart-${c})`,0,0]);document.getElementById('dlgTag').classList.remove('open');UI.toast('ok',L('Tag created','标签已创建'),n);render(false);dialogs();return}
  const dt=e.target.closest('[data-del]');if(dt){S.tags.splice(+dt.dataset.del,1);render(false)}
});
on('kit:change',()=>{Charts.anim=false;const open=qa('.overlay.open').map(o=>o.id);dialogs();open.forEach(id=>$('#'+id)?.classList.add('open'));render(false)});
on('kit:replay',()=>{Charts.anim=true;render(true)});
on('kit:gsap',()=>{Charts.anim=true;render(true)});
Charts.anim=false;dialogs();render(false);

})();
